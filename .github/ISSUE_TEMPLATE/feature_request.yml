name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Popcorn aims to stay small, fast and simple, so please describe the
        problem you want solved, not only the solution.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "When I watch a show with friends, I can't tell which episodes..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other ways to solve it, or how you work around it today.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to help build this.
